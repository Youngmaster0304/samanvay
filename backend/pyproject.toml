[project]
name = "samanvay-api"
version = "0.1.0"
description = "Samanvay: harmonization engine and reviewer workbench for multi-source urban land records"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "minio>=7.2",
    "pyyaml>=6.0",
    # Ingest (Stage 1): pyogrio/shapely/pyproj/pandas arrive with geopandas.
    "geopandas>=1.0",
    "rasterio>=1.3",
    # CRS engine (Stage 3): geometry columns and rubber-sheeting.
    "geoalchemy2>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build", "alembic/versions"]

# Celery's decorators are untyped; annotating every task would add noise for no
# benefit because the task bodies themselves stay strictly typed.
[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
